site_name: RoboGuide 技术文档
site_description: RoboGuide —— 分布式具身智能操作系统（DEAIOS）的架构基线、决策记录与开发文档
site_url: https://roboguide-docs.chaokedu.workers.dev
repo_url: https://github.com/Farewell-CK/RoboGuide
repo_name: Farewell-CK/RoboGuide

theme:
  name: material
  language: zh
  font: false
  custom_dir: custom_theme
  icon:
    repo: fontawesome/brands/github
  features:
    # NOTE: navigation.instant is intentionally disabled — it is incompatible
    # with the mkdocs-static-i18n language switcher.
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          site_name: RoboGuide 技术文档
        - locale: en
          name: English
          build: true
          site_name: RoboGuide Technical Docs
          nav_translations:
            项目概览: Overview
            快速开始: Getting Started
            架构与概念: Architecture and Concepts
            核心概念: Core Concepts
            执行生命周期: Execution Lifecycle
            State 与 Memory: State and Memory
            V2 架构手册: V2 Architecture Handbook
            开发与接入: Development and Integration
            模块地图: Module Map
            Integration 与 Node Service: Integration and Node Service
            Eval Harness 与本地集成: Eval Harness and Integrations
            部署与运维: Deployment and Operations
            状态与参考: Status and Reference
            版本与构建来源: Versions and Build Provenance
            ADR 主题索引: ADR Topics
            原始文档档案: Original Archives
            ADR 全索引: ADR Catalog
  - literate-nav:
      nav_file: SUMMARY.md

# The literate-nav navigation source must never ship as a page.
exclude_docs: |
  SUMMARY.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/diagrams.js
