site_name: RoboGuide 技术文档
site_description: RoboGuide —— 分布式具身智能操作系统（DEAIOS）的架构基线、决策记录与开发文档
site_url: https://roboguide-docs.chaokedu.workers.dev
repo_url: https://github.com/Farewell-CK/RoboGuide
repo_name: Farewell-CK/RoboGuide

theme:
  name: material
  language: zh
  font: false
  custom_dir: custom_theme
  icon:
    repo: fontawesome/brands/github
  features:
    # NOTE: navigation.instant is intentionally disabled — it is incompatible
    # with the mkdocs-static-i18n language switcher.
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          site_name: RoboGuide 技术文档
        - locale: en
          name: English
          build: true
          site_name: RoboGuide Technical Docs
          nav_translations:
            首页: Home
            快速开始: Getting Started
            架构导览: Architecture Tour
            模块地图: Module Maps
            Integration 与 Node Service: Integration & Node Service
            Eval Harness 与本地集成: Eval Harness & Integrations
            文档索引: Document Index
            项目范围: Project Scope
            MVP 定义: MVP Definition
            待定决策清单: Open Decisions
            架构: Architecture
            V2 架构基线: V2 Architecture Baseline
            V1.1 历史架构: V1.1 Historical Architecture
            架构图索引: Architecture Diagrams
            架构决策记录（ADR）: Architecture Decision Records
            开发: Development
            编码规范: Coding Standards
            运行时可靠性故障矩阵: Runtime Reliability Fault Matrix
            C1 前生产链准入审计: Pre-C1 Readiness Audit
            MI 协调指导验证: MI Coordination Guidance Validation
            设备扩展规范 v0.1: Device Extension Spec v0.1
            设备扩展规范 v0.2: Device Extension Spec v0.2
            E1 公平性集成计划: E1 Fairness Integration Plan
            E1 测试框架就绪审计: E1 Harness Readiness Audit
            E1 公平性基础: E1 Fairness Foundation
            E1 公平性评审挑战: E1 Fairness Reviewer Challenges
            评估证据有效性规范: Evaluation Evidence Validity
            F01-F07 集成回归: F01-F07 Integration Regression
            Robonix 地图适配器: Robonix Map Adapter
            Habitat Local EAIOS 桥: Habitat Local EAIOS Bridge
            仓库 README: Repository README
  - literate-nav:
      nav_file: SUMMARY.md

# The literate-nav navigation source must never ship as a page.
exclude_docs: |
  SUMMARY.md

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/custom.css
