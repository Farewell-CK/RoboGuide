site_name: RoboGuide 技术文档
site_description: RoboGuide —— 分布式具身智能操作系统（DEAIOS）的架构基线、决策记录与开发文档
site_url: https://roboguide-docs.chaokedu.workers.dev
repo_url: https://github.com/Farewell-CK/RoboGuide
repo_name: Farewell-CK/RoboGuide

theme:
  name: material
  language: zh
  font: false
  custom_dir: custom_theme
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md

# The literate-nav navigation source must never ship as a page.
exclude_docs: |
  SUMMARY.md

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/custom.css
