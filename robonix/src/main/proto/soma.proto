syntax = "proto3";

package robonix.client.soma;

option java_package = "com.robonix.proto.soma";
option java_outer_classname = "SomaProto";
option java_multiple_files = true;

// Mirrors the web client's soma_client.proto (Soma robot description).

message UrdfAsset {
  string path = 1;
  bytes data = 2;
}

message GetUrdf_Request {
  string robot_id = 1;
  bool include_assets = 2;
}

message GetUrdf_Response {
  string robot_id = 1;
  string urdf_xml = 2;
  repeated UrdfAsset assets = 3;
}

message GetYaml_Request {
  string robot_id = 1;
}

message GetYaml_Response {
  string robot_id = 1;
  string yaml_text = 2;
}
