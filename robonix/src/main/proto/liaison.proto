syntax = "proto3";

package robonix.liaison;

option java_package = "com.robonix.proto.liaison";
option java_outer_classname = "LiaisonProto";
option java_multiple_files = true;

import "pilot.proto";

message VoiceEvent {
  uint32 event_kind = 1;
  string session_id = 2;
  string text = 3;
  string user_id = 4;
  float confidence = 5;
  robonix.pilot.PilotEvent pilot = 6;
  string error = 7;
  string status_message = 8;
  uint64 timestamp_ms = 9;
}

message GetHandsfreeStatus_Request {}
message GetHandsfreeStatus_Response {
  bool enabled = 1;
  string state = 2;
  string keyword = 3;
  string mic_provider_id = 4;
  string speaker_provider_id = 5;
  uint64 last_wake_ms = 6;
  string last_transcript = 7;
  string last_error = 8;
}

message SetHandsfree_Request {
  bool enabled = 1;
  string mic_provider_id = 2;
  string speaker_provider_id = 3;
}
message SetHandsfree_Response {
  bool ok = 1;
  bool enabled = 2;
  string state = 3;
  string detail = 4;
}

message StartVoiceSession_Request {
  string session_id = 1;
  string client_user_id = 2;
  uint32 record_seconds = 3;
  string language = 4;
  bool tts_enabled = 5;
  string mic_node_id = 6;
  string asr_node_id = 7;
  string voiceprint_node_id = 8;
  string tts_node_id = 9;
  string speaker_node_id = 10;
  string context_json = 11;
}
message StartVoiceSession_Response {
  VoiceEvent event = 1;
}

// Early finish for a running voice session: submit what has been recognized
// so far instead of waiting for record_seconds to elapse. Separate unary
// contract from the streaming voice session itself.
message FinishVoiceCapture_Request {
  string session_id = 1;
}
message FinishVoiceCapture_Response {
  bool ok = 1;
  string session_id = 2;
  string detail = 3;
}

message WatchHandsfreeEvents_Request {}
message WatchHandsfreeEvents_Response {
  VoiceEvent event = 1;
}

// Service using contract-based paths matching robonix backend
service RobonixSystemLiaisonSubmit {
  rpc SubmitTask(robonix.pilot.Task) returns (stream robonix.pilot.PilotEvent);
}

service RobonixSystemLiaisonVoice {
  rpc StartVoiceSession(StartVoiceSession_Request) returns (stream StartVoiceSession_Response);
}

service RobonixSystemLiaisonVoiceFinish {
  rpc FinishVoiceCapture(FinishVoiceCapture_Request) returns (FinishVoiceCapture_Response);
}

service RobonixSystemLiaisonHandsfreeStatus {
  rpc GetHandsfreeStatus(GetHandsfreeStatus_Request) returns (GetHandsfreeStatus_Response);
}

service RobonixSystemLiaisonHandsfreeSetEnabled {
  rpc SetHandsfree(SetHandsfree_Request) returns (SetHandsfree_Response);
}

service RobonixSystemLiaisonHandsfreeEvents {
  rpc WatchHandsfreeEvents(WatchHandsfreeEvents_Request) returns (stream WatchHandsfreeEvents_Response);
}
