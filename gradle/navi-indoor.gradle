// Verify the delivered host APK, including accidental Flutter transitive dependencies.
tasks.register('verifyNaviDebugApk') {
    group = 'verification'
    dependsOn 'assembleDebug'
    doLast {
        // Inspect dependency components, not untyped Android artifacts: a project
        // publishes several artifact variants and legacy resolution is ambiguous.
        def components = configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents
        def flutter = components.findAll {
            it.moduleVersion?.group == 'io.flutter' || it.moduleVersion?.name?.startsWith('flutter_')
        }
        if (!flutter.isEmpty()) throw new GradleException('Native NAVI must not depend on Flutter artifacts: ' + flutter)
        if (!components.any { it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier && it.id.projectPath == ':naviindoor' }) {
            throw new GradleException('Native NAVI Android module is missing from the host')
        }
        def apks = fileTree(layout.buildDirectory.dir('outputs/apk/debug')).matching { include '*.apk' }.files
        if (apks.isEmpty()) throw new GradleException('No debug APK produced')
        apks.each { apk ->
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                def forbidden = zip.entries().findAll {
                    it.name.startsWith('assets/flutter_assets/') || it.name.endsWith('/libflutter.so') || it.name.endsWith('/libapp.so')
                }
                if (!forbidden.isEmpty()) throw new GradleException('Flutter runtime remains in native APK: ' + forbidden)
                if (zip.getEntry('classes.dex') == null) throw new GradleException('APK has no Android bytecode')
            }
        }
    }
}
