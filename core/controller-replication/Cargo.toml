[package]
name = "controller-replication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
artifact-store = { path = "../artifact-store" }
domain = { path = "../domain" }
libc = "0.2"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
state = { path = "../state" }
ports = { path = "../ports" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26.4"

[dev-dependencies]
tempfile = "3"
testkit = { path = "../testkit" }
tracing = "=0.1.44"
