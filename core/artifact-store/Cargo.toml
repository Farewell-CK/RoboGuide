[package]
name = "artifact-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
getrandom = "0.4"
libc = "0.2"
ports = { path = "../ports" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
