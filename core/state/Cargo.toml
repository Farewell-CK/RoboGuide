[package]
name = "state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
ports = { path = "../ports" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
artifact-store = { path = "../artifact-store" }
tempfile = "3"
