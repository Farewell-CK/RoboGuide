[package]
name = "integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "net", "sync", "time"] }
tokio-stream = "0.1"
prost = "0.14"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
