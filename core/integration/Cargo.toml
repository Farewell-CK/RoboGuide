[package]
name = "integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.53", features = ["net", "sync", "time"] }
tokio-stream = "0.1"
prost = "0.14"
ports = { path = "../ports" }
domain = { path = "../domain" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"

[dev-dependencies]
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53", features = ["macros", "rt", "time", "test-util"] }
testkit = { path = "../testkit" }
tokio-stream = { version = "0.1", features = ["net"] }
