[package]
name = "integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
