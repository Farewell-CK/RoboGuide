# Append-only node configuration fragment for `roboguide.node-config/v0.14`.
# Add these tables into each robot's node TOML (adjust `object_id`,
# `robot-1-sync-chassis-slot`, `local_locks`, and endpoint port per physical
# robot — RoboGuide requires globally unique resource IDs across nodes).
#
# CRITICAL SAFETY MUTUAL EXCLUSION:
# `local_locks` MUST include the same lock name used by single-robot chassis /
# Pilot operations (for example `["dog1-pilot-task"]` on Dog 1 or
# `["dog2-pilot-task"]` on Dog 2) so `roboguide-node` natively guarantees
# single-robot `task.delegate@v1` and coordinated `mobility.sync-follow@v1` /
# `choreography.play@v1` never drive the chassis concurrently.

[[local_systems]]
id = "sync-provider"
runtime_name = "roboguide-sync-provider"
runtime_version = "0.1.0"

[local_systems.metadata]
"roboguide.execution-safety" = '''{"schema":"roboguide.execution-safety/v0.2","operations":[{"operation":{"namespace":"mobility","name":"sync-follow","version":"v1"},"safe_state_export_id":"sync-safe-state","max_evidence_age_ms":1500,"stop_deadline_ms":10000,"min_confidence_millionths":null,"assurance":"device-observation"},{"operation":{"namespace":"choreography","name":"play","version":"v1"},"safe_state_export_id":"sync-safe-state","max_evidence_age_ms":1500,"stop_deadline_ms":10000,"min_confidence_millionths":null,"assurance":"device-observation"}]}'''

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]

[local_systems.health.step]
id = "sync-provider-health"
connection = "sync-http"

[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/sync/health"

[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "sync-http"
local_system = "sync-provider"
endpoint = "http://127.0.0.1:18210"
timeout_ms = 2500

[[capability_profiles]]
contract = "mobility.sync-follow@v1"
kind = "transport"
owner = "sync-provider"
attributes = { "sync-topology" = "sparse-neighbor-20hz", "max-linear-speed-mps" = 0.5 }

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "sync-follow-readiness"
connection = "sync-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/sync/readiness/sync-follow"

[capability_profiles.readiness.step.request]
base = {}

[[capability_profiles]]
contract = "choreography.play@v1"
kind = "transport"
owner = "sync-provider"
attributes = { "sync-mode" = "shared-t0-clock", "max-clock-offset-ms" = 20.0 }

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "choreography-play-readiness"
connection = "sync-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/sync/readiness/choreography"

[capability_profiles.readiness.step.request]
base = {}

[[state_exports]]
id = "sync-safe-state"
owner = "sync-provider"
object_class = "node"
object_type = "sync-safe-state"
object_id = "robot-1"
semantic = "observed"
payload_schema = "roboguide.safe-state-observation/v0.2"
valid_for_ms = 1500
interval_ms = 500
value_pointer = ""

[state_exports.step]
id = "sync-safe-state-observer"
connection = "sync-http"

[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/sync/executions/safe-state"

[state_exports.step.request]
base = {}

[[state_exports]]
id = "sync-peer-endpoint"
owner = "sync-provider"
object_class = "node"
object_type = "sync-endpoint"
object_id = "robot-1"
semantic = "reported"
payload_schema = "roboguide.sync-endpoint/v1"
valid_for_ms = 5000
interval_ms = 2000
value_pointer = ""

[state_exports.step]
id = "sync-peer-endpoint-observer"
connection = "sync-http"

[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/sync/endpoint"

[state_exports.step.request]
base = {}

[[peer_channel_observers]]
id = "sync-peer-channels"
owner = "sync-provider"
interval_ms = 250
valid_for_ms = 5000
channels_pointer = "/channels"

[peer_channel_observers.step]
id = "sync-peer-channel-observer"
connection = "sync-http"

[peer_channel_observers.step.operation]
kind = "http"
method = "GET"
path = "/v1/peer-channels"

[peer_channel_observers.step.request]
base = {}

[[resources]]
id = "robot-1-sync-chassis-slot"
kind = "space"
capacity = 1
allocation_mode = "exclusive"
owner = "sync-provider"

[[operations]]
operation = "mobility.sync-follow@v1"
owner = "sync-provider"
required_resources = ["robot-1-sync-chassis-slot"]
local_locks = ["dog1-pilot-task"]

[operations.workflow]
poll_interval_ms = 250

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/handle"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["PENDING"]
running = ["RUNNING"]
completed = ["SUCCEEDED"]
failed = ["FAILED"]
cancelled = ["CANCELED"]
unknown = ["UNKNOWN"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "sync-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions"

[operations.workflow.execute.request]
base = { budget_ms = 300000 }

[[operations.workflow.execute.request.bindings]]
target = "/attempt_id"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/attempt_id"

[[operations.workflow.execute.request.bindings]]
target = "/invocation"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "sync-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/handle"
[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "sync-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/handle"
[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations]]
operation = "choreography.play@v1"
owner = "sync-provider"
required_resources = ["robot-1-sync-chassis-slot"]
local_locks = ["dog1-pilot-task"]

[operations.workflow]
poll_interval_ms = 250

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/handle"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["PENDING"]
running = ["RUNNING"]
completed = ["SUCCEEDED"]
failed = ["FAILED"]
cancelled = ["CANCELED"]
unknown = ["UNKNOWN"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "sync-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions"

[operations.workflow.execute.request]
base = { budget_ms = 300000 }

[[operations.workflow.execute.request.bindings]]
target = "/attempt_id"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/attempt_id"

[[operations.workflow.execute.request.bindings]]
target = "/invocation"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "sync-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/handle"
[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "sync-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/sync/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/handle"
[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"
