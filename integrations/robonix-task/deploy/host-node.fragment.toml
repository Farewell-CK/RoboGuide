# Append to Node config v0.14; replace NODE_ID with the deployment's authenticated Node ID.
# The existing combined Connector needs --node-id with the same identity.
[[local_systems]]
id = "rg-host"
runtime_name = "rg-readonly-host-inspection"
runtime_version = "v0.1"
[local_systems.health]
state_pointer = "/health_state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]
[local_systems.health.step]
id = "host-health"
connection = "host-http"
[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"

[[connections]]
id = "host-http"
driver = "http"
local_system = "rg-host"
endpoint = "http://127.0.0.1:18112"
timeout_ms = 3000

[[capability_profiles]]
contract = "system.host.inspect@v1"
kind = "observation"
owner = "rg-host"
attributes = {}
[capability_profiles.readiness]
state_pointer = "/readiness_state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]
[capability_profiles.readiness.step]
id = "host-readiness"
connection = "host-http"
[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"

[[resources]]
id = "NODE_ID-host-slot"
kind = "compute"
capacity = 1
allocation_mode = "divisible"
resource_class = "system.host-inspection-slots/v1"
owner = "rg-host"

[[state_exports]]
id = "host-state"
owner = "rg-host"
object_class = "node"
object_type = "host-status"
object_id = "NODE_ID"
semantic = "reported"
payload_schema = "roboguide.host-inspection/v0.1"
interval_ms = 2000
valid_for_ms = 10000
value_pointer = ""
[state_exports.step]
id = "host-state"
connection = "host-http"
[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"

[[operations]]
operation = "system.host.inspect@v1"
owner = "rg-host"
required_resources = ["NODE_ID-host-slot"]
local_locks = ["host-inspection"]
[operations.workflow]
poll_interval_ms = 250
[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/host-dispatch/node_id"
[operations.workflow.execution_state]
state_pointer = "/steps/host-status/execution_state"
reason_pointer = "/steps/host-status/detail"
accepted = ["PENDING"]
running = ["RUNNING"]
completed = ["SUCCEEDED"]
failed = ["FAILED"]
cancelled = ["CANCELED"]
[[operations.workflow.execute]]
id = "host-dispatch"
connection = "host-http"
[operations.workflow.execute.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"
[[operations.workflow.status]]
id = "host-status"
connection = "host-http"
[operations.workflow.status.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"
[[operations.workflow.cancel]]
id = "host-cancel-observation"
connection = "host-http"
[operations.workflow.cancel.operation]
kind = "http"
method = "GET"
path = "/v1/host/status"
