[[local_systems]]
id = "dog2-pilot"
runtime_name = "robonix-pilot-adapter"
runtime_version = "task-delegation-v1"

[local_systems.metadata]
"roboguide.execution-safety" = '''{"schema":"roboguide.execution-safety/v0.2","operations":[{"operation":{"namespace":"task","name":"delegate","version":"v1"},"safe_state_export_id":"pilot-task-effects","max_evidence_age_ms":1500,"stop_deadline_ms":10000,"min_confidence_millionths":null,"assurance":"no-effects"}]}'''

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]
[local_systems.health.step]
id = "pilot-adapter-health"
connection = "pilot-http"
[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/pilot/health"
[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "pilot-http"
local_system = "dog2-pilot"
endpoint = "http://127.0.0.1:18112"
timeout_ms = 2500

[[capability_profiles]]
contract = "task.delegate@v1"
kind = "compute"
owner = "dog2-pilot"
attributes = { "task-profile" = "local-task-v1" }

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]
[capability_profiles.readiness.step]
id = "pilot-task-readiness"
connection = "pilot-http"
[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/pilot/readiness"
[capability_profiles.readiness.step.request]
base = {}

[[state_exports]]
id = "pilot-task-effects"
owner = "dog2-pilot"
object_class = "node"
object_type = "local-task-effects"
object_id = "lite3-dog2"
semantic = "observed"
payload_schema = "roboguide.safe-state-observation/v0.4"
valid_for_ms = 1500
interval_ms = 500
value_pointer = ""
[state_exports.step]
id = "pilot-task-effects-observer"
connection = "pilot-http"
[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/pilot/executions/safe-state"
[state_exports.step.request]
base = {}

[[resources]]
id = "dog2-pilot-task-slot"
kind = "space"
capacity = 1
owner = "dog2-pilot"

[[operations]]
operation = "task.delegate@v1"
owner = "dog2-pilot"
required_resources = ["dog2-pilot-task-slot"]
local_locks = ["dog2-pilot-task"]
[operations.workflow]
poll_interval_ms = 500
[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/handle"
[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["PENDING", "DISPATCHING"]
running = ["RUNNING"]
completed = ["SUCCEEDED"]
failed = ["FAILED"]
cancelled = ["CANCELED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "pilot-http"
[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"
[operations.workflow.execute.request]
base = { budget_ms = 300000 }
[[operations.workflow.execute.request.bindings]]
target = "/attempt_id"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/attempt_id"
[[operations.workflow.execute.request.bindings]]
target = "/invocation"
[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "pilot-http"
[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"
[operations.workflow.status.request]
base = {}
[[operations.workflow.status.request.bindings]]
target = "/handle"
[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "pilot-http"
[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"
[operations.workflow.cancel.request]
base = {}
[[operations.workflow.cancel.request.bindings]]
target = "/handle"
[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"
