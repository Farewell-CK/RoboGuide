# Append to the actual dog1 Node v0.14 config; replace NODE_ID with its enrolled identity.
# This capability reads bounded image content only. It never submits a Pilot task.
[[local_systems]]
id = "image-inspector"
runtime_name = "rg-readonly-image-inspection"
runtime_version = "v0.1"
[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]
[local_systems.health.step]
id = "image-health"
connection = "image-inspection-http"
[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/image-inspections/health"

[[connections]]
id = "image-inspection-http"
driver = "http"
local_system = "image-inspector"
endpoint = "http://127.0.0.1:18112"
timeout_ms = 3000

[[capability_profiles]]
contract = "image.inspect@v1"
kind = "compute"
owner = "image-inspector"
attributes = {}
[capability_profiles.readiness]
state_pointer = "/readiness_state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]
[capability_profiles.readiness.step]
id = "image-readiness"
connection = "image-inspection-http"
[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/image-inspections/health"

[[resources]]
id = "NODE_ID-image-slot"
kind = "compute"
capacity = 1
allocation_mode = "divisible"
resource_class = "image.inspection-slots/v1"
owner = "image-inspector"

[[state_exports]]
id = "image-inspection-result"
owner = "image-inspector"
object_class = "node"
object_type = "image-inspection"
object_id = "NODE_ID"
semantic = "reported"
payload_schema = "roboguide.image-inspection-result/v0.1"
interval_ms = 500
valid_for_ms = 15000
value_pointer = ""
[state_exports.step]
id = "image-result"
connection = "image-inspection-http"
[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/image-inspections/latest"

[[operations]]
operation = "image.inspect@v1"
owner = "image-inspector"
required_resources = ["NODE_ID-image-slot"]
local_locks = ["image-inspection"]
[operations.workflow]
poll_interval_ms = 250
[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/image-submit/handle"
[operations.workflow.execution_state]
state_pointer = "/steps/image-status/state"
reason_pointer = "/steps/image-status/detail"
accepted = ["PENDING"]
running = ["RUNNING"]
completed = ["SUCCEEDED"]
failed = ["FAILED"]
cancelled = ["CANCELED"]
[[operations.workflow.execute]]
id = "image-submit"
connection = "image-inspection-http"
[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/image-inspections"
[operations.workflow.execute.request]
base = {}
[[operations.workflow.execute.request.bindings]]
target = "/attempt_id"
value = { kind = "pointer", pointer = "/attempt_id" }
[[operations.workflow.execute.request.bindings]]
target = "/invocation"
value = { kind = "pointer", pointer = "/invocation" }
[[operations.workflow.status]]
id = "image-status"
connection = "image-inspection-http"
[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/image-inspections/status"
[operations.workflow.status.request]
base = {}
[[operations.workflow.status.request.bindings]]
target = "/handle"
value = { kind = "pointer", pointer = "/local_handle" }
[[operations.workflow.cancel]]
id = "image-cancel"
connection = "image-inspection-http"
[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/image-inspections/cancel"
[operations.workflow.cancel.request]
base = {}
[[operations.workflow.cancel.request.bindings]]
target = "/handle"
value = { kind = "pointer", pointer = "/local_handle" }
