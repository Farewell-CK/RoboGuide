name: CI

on:
  push:
    branches:
      - main
      - codex/nonrelease-remediation-closure
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "${RUNNER_TEMP}/roboguide-cargo-test.log"

      - name: Check private Rust documentation
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Set up uv for native deployment inspection
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build the actual Controller composition
        run: cargo build --locked -p integration-server -p controller-replica -p roboguide-node

      - name: Build the actual Controller connection lifetime probe
        run: cargo build --locked -p state --example controller_storage_probe

      - name: Build the actual inactive Controller projection probes
        run: |
          cargo build --locked -p controller-replica --example projection_probe
          cargo build --locked -p state --example replica_state_probe

      - name: Verify actual Controller original SQL installation and hardlink refusal
        run: >
          uv run --frozen python tools/quality/check_controller_projection_processes.py
          --output "${RUNNER_TEMP}/roboguide-controller-projection"

      - name: Build the actual single-worker replica listener probe
        run: cargo build --locked -p controller-replication --example replica_transport_probe

      - name: Verify actual bounded replica TCP and TLS lifetimes with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_replica_transport_processes.py
          --output "${RUNNER_TEMP}/roboguide-replica-transport"

      - name: Verify actual original member SQL restart compatibility with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_replica_member_compatibility_processes.py
          --probe target/debug/examples/replica_transport_probe
          --output /tmp/rg-ci-member-compatibility

      - name: Verify actual Controller inode writer generation and complete cold recovery
        run: >
          uv run --frozen python tools/quality/check_controller_storage_processes.py
          --output "${RUNNER_TEMP}/roboguide-controller-storage"

      - name: Verify actual original GC SQL interruption and complete cold recovery
        run: >
          uv run --frozen python tools/quality/check_artifact_sql_recovery_processes.py
          --output "${RUNNER_TEMP}/roboguide-artifact-sql-recovery"

      - name: Inspect the real deployment with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_deployment_profile_processes.py
          --output "${RUNNER_TEMP}/roboguide-deployment-inspection"

      - name: Verify Control quota policy with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_resource_quota_processes.py
          --output "${RUNNER_TEMP}/roboguide-resource-quota"

      - name: Verify local Memory references with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_memory_reference_processes.py
          --output "${RUNNER_TEMP}/roboguide-memory-references"

      - name: Verify actual import Replica retention with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_import_replica_processes.py
          --output "${RUNNER_TEMP}/roboguide-import-replicas"

      - name: Verify original Snapshot references with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_snapshot_reference_processes.py
          --relocated-abort
          --output "${RUNNER_TEMP}/roboguide-snapshot-references"

      - name: Build actual Artifact layout process probe
        run: cargo build --locked -p artifact-store --example layout_probe

      - name: Build actual member-local content process probe
        run: >
          cargo build --locked -p controller-replication
          --example content_store_probe --example content_stream_probe
          --example content_network_probe --example prepared_source_probe
          --example owned_content_source_probe

      - name: Verify actual original owned Unix and State content commits with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_network_content_processes.py
          --probe target/debug/examples/content_network_probe
          --storage-probe target/debug/examples/content_stream_probe
          --owned-source-probe target/debug/examples/owned_content_source_probe
          --members 211,227,239
          --output /tmp/rg-ci-owned-content

      - name: Verify actual runnable Controller content and original child restart with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_runnable_content_processes.py
          --supervisor target/debug/controller-replica
          --controller target/debug/integration-server
          --storage-probe target/debug/examples/content_stream_probe
          --idle-timer-check
          --output /tmp/rg-ci-runnable-content

      - name: Verify actual Prepared source scopes and native restart with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_prepared_source_processes.py
          --probe target/debug/examples/prepared_source_probe
          --storage-probe target/debug/examples/content_stream_probe
          --source-probe target/debug/examples/content_store_probe
          --output "${RUNNER_TEMP}/roboguide-prepared-sources"

      - name: Verify original bounded content streams with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_content_stream_processes.py
          --binary target/debug/examples/content_stream_probe
          --source-probe target/debug/examples/content_store_probe
          --output "${RUNNER_TEMP}/roboguide-content-streams"

      - name: Verify actual member-local content interruption and reader ownership
        run: >
          uv run --frozen python tools/quality/check_replica_content_processes.py
          --probe target/debug/examples/content_store_probe
          --profile 2d14edd6619be91bcec675bb0e53a5fcb4590a662f1a0548e8eb009edcb8f867
          --member 23 --payload-mib 64
          --output "${RUNNER_TEMP}/roboguide-member-content"

      - name: Verify actual Artifact owner and cold restore with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_artifact_owner_processes.py
          --skip-build --output "${RUNNER_TEMP}/roboguide-artifact-owner"

      - name: Verify actual Catalog acquisition and original retirement
        run: >
          uv run --frozen python tools/quality/check_memory_preparation_processes.py
          --output /tmp/rg-ci-catalog-retirement --process-workers --artifact-retention
          --async-workers 1

      - name: Verify actual network content ACK and native process failover with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_network_content_processes.py
          --probe target/debug/examples/content_network_probe
          --storage-probe target/debug/examples/content_stream_probe
          --source /tmp/rg-ci-catalog-retirement --members 137,149,163
          --output "${RUNNER_TEMP}/roboguide-network-content"

      - name: Verify original child lineage through stopped Group handoff
        run: >
          uv run --frozen python tools/quality/check_memory_preparation_processes.py
          --output /tmp/rg-ci-catalog-handoff --handoff-case complete
          --process-workers --artifact-retention --async-workers 1

      - name: Verify actual MI revision and independent original goal
        run: >
          uv run --frozen python tools/quality/check_memory_preparation_processes.py
          --output /tmp/rg-ci-catalog-mi --handoff-case revision-mi
          --process-workers --artifact-retention --async-workers 1

      - name: Verify exact Catalog and lineage bytes through cold restore
        run: >
          uv run --frozen python tools/quality/check_catalog_reference_recovery_processes.py
          --from /tmp/rg-ci-catalog-mi --output "${RUNNER_TEMP}/roboguide-catalog-recovery"

      - name: Produce actual unaccounted Catalog under the explicit legacy storage profile
        run: >
          uv run --frozen python tools/quality/check_memory_preparation_processes.py
          --output /tmp/rg-ci-legacy-catalog --process-workers --async-workers 1

      - name: Verify explicit Catalog adoption with actual mTLS SQL and cold restore
        run: >
          uv run --frozen python tools/quality/check_catalog_adoption_processes.py
          --from /tmp/rg-ci-legacy-catalog --output "${RUNNER_TEMP}/roboguide-catalog-adoption"

      - name: Build actual readonly source reclamation observer
        run: cargo build --locked -p artifact-store --example reclamation_probe

      - name: Verify source GC with actual original retirement and cold restore
        run: >
          uv run --frozen python tools/quality/check_artifact_reclamation_processes.py
          --from "${RUNNER_TEMP}/roboguide-catalog-adoption"
          --output "${RUNNER_TEMP}/roboguide-source-reclamation"

      - name: Verify released original MI history and independent child lineage through source GC
        run: >
          uv run --frozen python tools/quality/check_artifact_reclamation_processes.py
          --from /tmp/rg-ci-catalog-mi
          --output "${RUNNER_TEMP}/roboguide-mi-source-reclamation"

      - name: Verify Artifact journal migration and actual cold restore with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_artifact_owner_processes.py
          --skip-build --reference-journal --output "${RUNNER_TEMP}/roboguide-artifact-journal"

      - name: Verify actual Artifact Snapshot interruption and original reconciliation
        run: >
          uv run --frozen python tools/quality/check_artifact_snapshot_processes.py
          --skip-build --output "${RUNNER_TEMP}/roboguide-artifact-snapshot"

      - name: Build complete original State materialization probe
        run: |
          cargo build --locked -p state --example replica_state_probe -p controller-replication --example content_snapshot_probe
          cargo build --locked -p controller-replica --bin controller-replica

      - name: Verify actual original content Archive with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_content_archive_processes.py
          --skip-build --abort-unpublished
          --replica-state-probe target/debug/examples/replica_state_probe
          --controller-projection-probe target/debug/examples/projection_probe
          --replica-snapshot-probe target/debug/examples/content_snapshot_probe
          --replica-content-probe target/debug/examples/content_store_probe
          --original-producer-journal
          --adopt-original-parents --content-maintenance-binary target/debug/controller-replica
          --output "${RUNNER_TEMP}/roboguide-content-archive"

      - name: Verify private Archive recipient retirement and actual GC with zero Nodes
        run: >
          uv run --frozen python tools/quality/check_archive_recipient_processes.py
          --output "${RUNNER_TEMP}/roboguide-archive-recipient"
          --old-controller "${GITHUB_WORKSPACE}/target/debug/integration-server"

      - name: Verify original file Catalog replay after actual Archive
        run: >
          uv run --frozen python tools/quality/check_memory_preparation_processes.py
          --output /tmp/rg-ci-catalog-archive --process-workers --artifact-retention
          --content-archive --async-workers 1

      - name: Verify actual archived Catalog cold recovery
        run: >
          uv run --frozen python tools/quality/check_catalog_archive_recovery_processes.py
          --from /tmp/rg-ci-catalog-archive --output "${RUNNER_TEMP}/roboguide-catalog-archive-recovery"

      - name: Retain native gate failure observations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-gate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/roboguide-cargo-test.log
            /tmp/rg-ci-*/**/*.log
            /tmp/rg-ci-*/**/result.json
            /tmp/rg-ci-*/*.sqlite3
            /tmp/rg-ci-*/**/source-identity.json
            ${{ runner.temp }}/roboguide-*/**/result.json
            ${{ runner.temp }}/roboguide-*/**/*.log
            ${{ runner.temp }}/roboguide-*/**/request-*.json
            ${{ runner.temp }}/roboguide-*/**/source-identity.json

  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up deployment compatibility Python
        uses: actions/setup-python@v7
        id: deployment-python
        with:
          python-version: "3.9"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev --frozen

      - name: Check formatting
        run: >
          uv run ruff format --check mission apps/mission-service apps/recovery-tool
          tools/quality tools/deployment tools/observability integrations/robonix-map-service
          integrations/memory-provider integrations/spatial-provider integrations/habitat-local-eaios
          evaluation website

      - name: Run Ruff
        run: >
          uv run ruff check mission apps/mission-service apps/recovery-tool
          tools/quality tools/deployment tools/observability integrations/robonix-map-service
          integrations/memory-provider integrations/spatial-provider integrations/habitat-local-eaios
          evaluation website

      - name: Run mypy
        run: >
          uv run mypy --strict mission/src mission/tests apps/mission-service tools/quality
          tools/deployment tools/observability/observability_profile.py
          apps/recovery-tool/roboguide_recovery apps/recovery-tool/tests
          integrations/memory-provider/roboguide_memory_provider
          integrations/spatial-provider/roboguide_spatial_provider
          integrations/robonix-map-service/robonix-map-service.py integrations/robonix-map-service/tests
          integrations/habitat-local-eaios/habitat_local_eaios integrations/habitat-local-eaios/tests
          website/sync_docs.py

      - name: Check provider and evaluation types
        run: |
          uv run mypy --strict integrations/memory-provider/roboguide_memory_provider integrations/memory-provider/tests
          uv run mypy --strict integrations/spatial-provider/roboguide_spatial_provider integrations/spatial-provider/tests
          uv run mypy --strict evaluation/src evaluation/tests
          uv run mypy --strict tools/observability

      - name: Check Python function documentation
        run: >
          uv run python tools/quality/check_python_function_docs.py
          mission apps/mission-service apps/recovery-tool tools/quality tools/deployment tools/observability
          integrations/robonix-map-service integrations/memory-provider integrations/spatial-provider
          integrations/habitat-local-eaios evaluation website

      - name: Run tests
        run: uv run pytest -q
        env:
          ROBOGUIDE_HABITAT_PYTHON: ${{ steps.deployment-python.outputs.python-path }}
