name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install client
        run: python -m pip install -e '.[audio]'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend build and Playwright
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install client
        run: python -m pip install -e .
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build committed bundle
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- ../src/robonix_client/static/vitals.bundle.js
      - name: Run Playwright
        working-directory: frontend
        env:
          ROBONIX_CLIENT_PYTHON: python
        run: npm run test:visual
