[mission]
planner = "llm"
contract_version = "roboguide.mission-plan/v0.8"
schema_path = "contracts/mission/v0.8/mission-plan.schema.json"
capability_catalog_path = "scenarios/e2-coherent-graph/capability-catalog.json"
review_enabled = true
max_repair_attempts = 2
prevalidation_recovery_attempts = 2

[mission.satisfaction_policy]
policy_ref = "roboguide.mission-satisfaction/receive-age/v1"
max_evidence_age_ms = 5000

[mission.prompts]
version = "v0"
interpreter_path = "mission/prompts/v0/interpreter.md"
planner_path = "mission/prompts/v0/planner.md"
reviewer_path = "mission/prompts/v0/reviewer.md"
repairer_path = "mission/prompts/v0/repairer.md"

[mission.llm]
model_provider = "OpenAI"
model = "gpt-6-sol"
review_model = "gpt-6-sol"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"
max_output_tokens = 8192
timeout_seconds = 600

[model_providers.OpenAI]
name = "OpenAI"
base_url = "http://101.43.45.215:8080"
wire_api = "responses"
responses_path = "/responses"
requires_openai_auth = true
api_key_env = "OPENAI_API_KEY"
