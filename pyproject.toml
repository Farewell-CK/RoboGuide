[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboguide"
version = "0.1.0"
description = "A scaffold for a distributed embodied AI operating system."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - see repository ownership and contribution policy."}
authors = [
  {name = "RoboGuide Contributors"},
]
dependencies = []

[project.scripts]
roboguide = "roboguide.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
