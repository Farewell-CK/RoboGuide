[project]
name = "mission-intelligence"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
mission = "mission.cli:main"
mission-service = "mission.api:main"
roboguide-eval = "roboguide_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["mission/src/mission", "evaluation/src/roboguide_eval"]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["integrations/spatial-provider", "apps/recovery-tool"]
testpaths = [
    "tools/observability/tests",
    "apps/recovery-tool/tests",
    "mission/tests",
    "integrations/robonix-map-service/tests",
    "integrations/memory-provider/tests",
    "integrations/spatial-provider/tests",
    "integrations/habitat-local-eaios/tests",
    "evaluation/tests",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "tools/observability",
    "apps/recovery-tool/roboguide_recovery",
    "apps/recovery-tool/tests",
    "integrations/memory-provider/roboguide_memory_provider",
    "integrations/memory-provider/tests",
    "integrations/spatial-provider/roboguide_spatial_provider",
    "integrations/spatial-provider/tests",
    "mission/src",
    "mission/tests",
    "apps/mission-service",
    "tools/quality",
    "integrations/robonix-map-service",
    "integrations/habitat-local-eaios",
    "evaluation/src",
    "evaluation/tests",
]

[[tool.mypy.overrides]]
module = "mission.*"
# The mission package ships without a py.typed marker; the Eval Harness
# consumes its runtime API but strict checking of its internals stays with
# the mission package's own tooling.
ignore_missing_imports = true
follow_imports = "silent"
