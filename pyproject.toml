[project]
name = "mission-intelligence"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
mission = "mission.cli:main"
mission-service = "mission.api:main"
roboguide-eval = "roboguide_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["mission/src/mission", "evaluation/src/roboguide_eval"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["mission/tests", "integrations/robonix-map-service/tests", "evaluation/tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "mission/src",
    "mission/tests",
    "apps/mission-service",
    "tools/quality",
    "integrations/robonix-map-service",
    "evaluation/src",
    "evaluation/tests",
]
