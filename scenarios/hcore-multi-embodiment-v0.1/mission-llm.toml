# 主智能体 (Mission Intelligence) 的模型配置 — 用于以一句自然语言指令同时调度
# 四个 robonix 子智能体 (本场景的四个节点)。
#
# 与 config/mission.toml 的唯一区别: capability_catalog_path 指向本场景的
# capability-catalog.json —— 那份词汇表只包含四个子智能体**真实暴露**的四个契约
# (mobility.navigate@v1 / observation.verify@v1 / observation.survey@v1 /
#  object.relocate@v1) 与它们的真实参数, 因此模型不会规划出这个机队无法执行的操作。
# LLM 端点/模型/凭据机制与 config/mission.toml 保持一致; 换模型时两处都要改
# (凭据仍然只从环境变量 OPENAI_API_KEY 读取, 绝不写进本文件)。
[mission]
planner = "llm"
contract_version = "roboguide.mission-plan/v0.8"
schema_path = "contracts/mission/v0.8/mission-plan.schema.json"
capability_catalog_path = "scenarios/hcore-multi-embodiment-v0.1/capability-catalog.json"
review_enabled = true
max_repair_attempts = 2
prevalidation_recovery_attempts = 2

[mission.satisfaction_policy]
policy_ref = "roboguide.mission-satisfaction/receive-age/v1"
max_evidence_age_ms = 5000

[mission.prompts]
version = "v0"
interpreter_path = "mission/prompts/v0/interpreter.md"
planner_path = "mission/prompts/v0/planner.md"
reviewer_path = "mission/prompts/v0/reviewer.md"
repairer_path = "mission/prompts/v0/repairer.md"

[mission.llm]
model_provider = "OpenAI"
model = "gpt-6-luna"
review_model = "gpt-6-luna"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"
max_output_tokens = 4096
timeout_seconds = 600

[model_providers.OpenAI]
name = "OpenAI"
base_url = "http://101.43.45.215:8080/v1"
wire_api = "responses"
responses_path = "/responses"
requires_openai_auth = true
api_key_env = "OPENAI_API_KEY"
