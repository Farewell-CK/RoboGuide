schema = "roboguide.node-config/v0.13"
node_id = "mujoco-arm"
server_endpoint = "http://127.0.0.1:50151"
state_directory = "/var/tmp/rg-chat/node-state-arm"
reconnect_delay_ms = 1000

[artifacts]
endpoint = "http://127.0.0.1:8090"
cache_directory = "/var/tmp/rg-chat/artifact-cache-arm"
max_artifact_bytes = 4294967296
chunk_size_bytes = 1048576
connect_timeout_ms = 5000
read_timeout_ms = 30000

[[local_systems]]
id = "mujoco-arm-eaios"
runtime_name = "mujoco-facade"
runtime_version = "0.1.0"

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["READY", "ONLINE"]
degraded = ["DEGRADED"]
offline = ["UNAVAILABLE", "OFFLINE"]

[local_systems.health.step]
id = "capability-health"
connection = "arm-http"

[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/object.relocate"

[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "arm-http"
local_system = "mujoco-arm-eaios"
endpoint = "http://127.0.0.1:28115"
timeout_ms = 5000

[[capability_profiles]]
contract = "object.relocate@v1"
kind = "transport"
owner = "mujoco-arm-eaios"
attributes = { "location-access" = "base-floor", "supports-floor-transition" = false }

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "readiness"
connection = "arm-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/object.relocate"

[capability_profiles.readiness.step.request]
base = {}

[[resources]]
id = "arm-slot"
kind = "compute"
capacity = 1
owner = "mujoco-arm-eaios"

[[state_exports]]
id = "arm-state"
owner = "mujoco-arm-eaios"
object_class = "node"
object_type = "runtime"
object_id = "mujoco-arm"
semantic = "reported"
payload_schema = "roboguide.example.runtime-health/v0.1"
valid_for_ms = 15000
interval_ms = 5000
value_pointer = ""

[state_exports.step]
id = "arm-state"
connection = "arm-http"

[state_exports.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/object.relocate"

[state_exports.step.request]
base = {}

[[operations]]
operation = "object.relocate@v1"
owner = "mujoco-arm-eaios"
required_resources = []

[operations.workflow]
poll_interval_ms = 200

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "arm-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "arm-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "arm-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

