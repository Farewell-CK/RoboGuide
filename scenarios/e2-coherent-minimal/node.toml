schema = "roboguide.node-config/v0.7"
node_id = "coherent-team-e2-s0"
server_endpoint = "http://127.0.0.1:25060"
state_directory = "NODE_STATE_PLACEHOLDER"
reconnect_delay_ms = 500

[[local_systems]]
id = "coherent-local-eaios"
runtime_name = "coherent-omnigibson-isaac"
runtime_version = "e2-s0"

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]

[local_systems.health.step]
id = "coherent-health"
connection = "coherent-http"

[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/health"

[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "coherent-http"
local_system = "coherent-local-eaios"
endpoint = "http://127.0.0.1:28110"
timeout_ms = 5000

[[capability_profiles]]
contract = "coherent.execute-plan@v1"
kind = "transport"
owner = "coherent-local-eaios"
attributes = {}

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "coherent-plan-readiness"
connection = "coherent-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/coherent.execute-plan"

[capability_profiles.readiness.step.request]
base = {}

[[resources]]
id = "coherent-simulator-slot"
kind = "space"
capacity = 1
owner = "coherent-local-eaios"

[[operations]]
operation = "coherent.execute-plan@v1"
owner = "coherent-local-eaios"
required_resources = ["coherent-simulator-slot"]
local_locks = ["coherent-omnigibson-world"]

[operations.workflow]
poll_interval_ms = 500

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "coherent-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "coherent-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "coherent-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"
