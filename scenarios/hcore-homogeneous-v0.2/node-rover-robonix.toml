# RoboGuide 异构场景: UGV 履带车节点 (Local EAIOS = Robonix OS)
#
# 物理后端是 H-CoRE 的 MuJoCo 竞技场 (arena_roboguide.xml), 由
# integrations/hcore-mujoco-local-eaios 提供 loopback HTTP facade。
# 本文件只描述 canonical What 与本地 workflow, 不含任何 OM1 专属字段。
schema = "roboguide.node-config/v0.7"
node_id = "hcore-rover"
server_endpoint = "http://127.0.0.1:50051"
state_directory = "node-state-rover"
reconnect_delay_ms = 500

[[local_systems]]
id = "robonix-runtime"
runtime_name = "robonix-os"
runtime_version = "0.1.0-mujoco-bridge"

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]

[local_systems.health.step]
id = "rover-health"
connection = "robonix-http"

[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/health"

[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "robonix-http"
local_system = "robonix-runtime"
endpoint = "http://127.0.0.1:28112"
timeout_ms = 5000

[[capability_profiles]]
contract = "mobility.navigate@v1"
kind = "mobility"
owner = "robonix-runtime"
# push-capable: 前铲与可移动障碍 obs2 的接触位掩码 (contype/conaffinity 3/3)
# 使本平台能真实推动它; 四足狗与之不接触, 故声明 false。Mission 侧用
# capability constraint 表达"这个任务需要能推的执行者", 由 Control 在匹配时
# 排除不具备者 —— 取代原先靠 actor placement 硬钉节点的做法。
attributes = { "push-capable" = true }

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "rover-navigation-readiness"
connection = "robonix-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/mobility.navigate"

[capability_profiles.readiness.step.request]
base = {}

[[capability_profiles]]
contract = "observation.verify@v1"
kind = "observation"
owner = "robonix-runtime"
attributes = {}

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "rover-verify-readiness"
connection = "robonix-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/observation.verify"

[capability_profiles.readiness.step.request]
base = {}

[[resources]]
id = "hcore-rover-space"
kind = "space"
capacity = 1
owner = "robonix-runtime"

[[operations]]
operation = "mobility.navigate@v1"
owner = "robonix-runtime"
required_resources = ["hcore-rover-space"]
local_locks = ["mujoco-rover-body"]

[operations.workflow]
poll_interval_ms = 100

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "robonix-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "robonix-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "robonix-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations]]
operation = "observation.verify@v1"
owner = "robonix-runtime"
required_resources = ["hcore-rover-space"]
local_locks = ["mujoco-rover-body"]

[operations.workflow]
poll_interval_ms = 100

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "robonix-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "robonix-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "robonix-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"
