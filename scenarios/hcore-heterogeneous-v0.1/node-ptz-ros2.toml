# RoboGuide 异构场景: PTZ 云台相机节点 (Local EAIOS = ROS 2 + Nav2/MoveIt 2 裸栈)
#
# 物理后端是 H-CoRE 的 MuJoCo 竞技场 (arena_roboguide.xml), 由
# integrations/hcore-mujoco-local-eaios 提供 loopback HTTP facade。
# 本文件只描述 canonical What 与本地 workflow, 不含任何 OM1 专属字段。
schema = "roboguide.node-config/v0.7"
node_id = "hcore-ptz"
server_endpoint = "http://127.0.0.1:50051"
state_directory = "node-state-ptz"
reconnect_delay_ms = 500

[[local_systems]]
id = "ros2-runtime"
runtime_name = "ros2-nav2-moveit2"
runtime_version = "0.1.0-mujoco-bridge"

[local_systems.health]
state_pointer = "/state"
detail_pointer = "/detail"
online = ["ONLINE"]
degraded = ["DEGRADED"]
offline = ["OFFLINE"]

[local_systems.health.step]
id = "ptz-health"
connection = "ros2-http"

[local_systems.health.step.operation]
kind = "http"
method = "GET"
path = "/v1/health"

[local_systems.health.step.request]
base = {}

[[connections]]
driver = "http"
id = "ros2-http"
local_system = "ros2-runtime"
endpoint = "http://127.0.0.1:28113"
timeout_ms = 5000

[[capability_profiles]]
contract = "observation.verify@v1"
kind = "observation"
owner = "ros2-runtime"
attributes = {}

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "ptz-verify-readiness"
connection = "ros2-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/observation.verify"

[capability_profiles.readiness.step.request]
base = {}

# 巡检: 云台转过四个方位各拍一张, 并本地判定目标是否在机械臂抓取范围内。
# 与 verify 同属 observation 家族, 但只有带 pan/tilt 的云台才 READY。
[[capability_profiles]]
contract = "observation.survey@v1"
kind = "observation"
owner = "ros2-runtime"
attributes = {}

[capability_profiles.readiness]
state_pointer = "/state"
detail_pointer = "/detail"
ready = ["READY"]
unavailable = ["UNAVAILABLE"]

[capability_profiles.readiness.step]
id = "ptz-survey-readiness"
connection = "ros2-http"

[capability_profiles.readiness.step.operation]
kind = "http"
method = "GET"
path = "/v1/capabilities/observation.survey"

[capability_profiles.readiness.step.request]
base = {}

[[resources]]
id = "hcore-ptz-fov"
kind = "space"
capacity = 1
owner = "ros2-runtime"

[[operations]]
operation = "observation.verify@v1"
owner = "ros2-runtime"
required_resources = ["hcore-ptz-fov"]
local_locks = ["mujoco-ptz-body"]

[operations.workflow]
poll_interval_ms = 100

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "ros2-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "ros2-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "ros2-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

# 巡检 (第 0 步门禁): 与 verify 同一套 dispatch/status/cancel 流程, 区别只在
# canonical operation 名 —— 参数 (target/views) 由 /invocation 原样透传。
[[operations]]
operation = "observation.survey@v1"
owner = "ros2-runtime"
required_resources = ["hcore-ptz-fov"]
local_locks = ["mujoco-ptz-body"]

[operations.workflow]
poll_interval_ms = 100

[operations.workflow.local_handle]
kind = "pointer"
pointer = "/steps/dispatch/execution_id"

[operations.workflow.execution_state]
state_pointer = "/steps/status/state"
reason_pointer = "/steps/status/detail"
accepted = ["ACCEPTED"]
running = ["RUNNING"]
completed = ["COMPLETED"]
failed = ["FAILED"]
cancelled = ["CANCELLED"]
case_sensitive = false

[[operations.workflow.execute]]
id = "dispatch"
connection = "ros2-http"

[operations.workflow.execute.operation]
kind = "http"
method = "POST"
path = "/v1/executions"

[operations.workflow.execute.request]
base = {}

[[operations.workflow.execute.request.bindings]]
target = "/invocation"

[operations.workflow.execute.request.bindings.value]
kind = "pointer"
pointer = "/invocation"

[[operations.workflow.status]]
id = "status"
connection = "ros2-http"

[operations.workflow.status.operation]
kind = "http"
method = "POST"
path = "/v1/executions/status"

[operations.workflow.status.request]
base = {}

[[operations.workflow.status.request.bindings]]
target = "/execution_id"

[operations.workflow.status.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"

[[operations.workflow.cancel]]
id = "cancel"
connection = "ros2-http"

[operations.workflow.cancel.operation]
kind = "http"
method = "POST"
path = "/v1/executions/cancel"

[operations.workflow.cancel.request]
base = {}

[[operations.workflow.cancel.request.bindings]]
target = "/execution_id"

[operations.workflow.cancel.request.bindings.value]
kind = "pointer"
pointer = "/local_handle"
