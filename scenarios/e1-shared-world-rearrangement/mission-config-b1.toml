# Controlled independent B1 uses production MI and the existing exact-goal verifier policy.
[mission]
planner = "llm"
contract_version = "roboguide.mission-plan/v0.8"
schema_path = "contracts/mission/v0.8/mission-plan.schema.json"
capability_catalog_path = "contracts/capability/v0.3/catalog.json"
review_enabled = true
max_repair_attempts = 2
# Per-generation-cycle pre-validation draft-structure retry budget for Planner
# and Repairer, frozen at startup; independent of valid Review/Repair rounds.
prevalidation_recovery_attempts = 2

[mission.satisfaction_policy]
# ADR-0039: five-second RoboGuide receive-age acceptance window, not physical validity or duration.
# Deployment policy owns this value. Omitting this table supplies no verifier freshness default.
policy_ref = "roboguide.mission-satisfaction/authoritative-goal/v1"
max_evidence_age_ms = 5000

# Deployment policy: all terminal Tasks for a frozen authoritative joint goal
# require one exact final-world verifier. It does not change the user goal.
[mission.satisfaction_policy.authoritative_goal_verifier]
namespace = "observation"
name = "verify"
version = "v1"

[mission.prompts]
version = "v0"
interpreter_path = "mission/prompts/v0/interpreter.md"
planner_path = "mission/prompts/v0/planner.md"
reviewer_path = "mission/prompts/v0/reviewer.md"
repairer_path = "mission/prompts/v0/repairer.md"

[mission.llm]
model_provider = "OpenAI"
model = "gpt-6.1-sol"
review_model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"
max_output_tokens = 4096
timeout_seconds = 600

[model_providers.OpenAI]
name = "OpenAI"
base_url = "http://101.43.45.215:8080"
wire_api = "responses"
responses_path = "/responses"
requires_openai_auth = true
api_key_env = "OPENAI_API_KEY"
