[package]
name = "integration-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
integration = { path = "../../core/integration" }
orchestration = { path = "../../core/orchestration" }
control = { path = "../../core/control" }
domain = { path = "../../core/domain" }
ports = { path = "../../core/ports" }
state = { path = "../../core/state" }
runtime = { path = "../../core/runtime" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
