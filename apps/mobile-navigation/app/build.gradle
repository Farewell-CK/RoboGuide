plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def localString = { String key ->
    def value = localProperties.getProperty(key, '')
            .replace('\\', '\\\\')
            .replace('"', '\\"')
    return '"' + value + '"'
}

android {
    namespace 'com.elabrador.mobilenavigation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elabrador.mobilenavigation'
        minSdk 24
        targetSdk 35
        versionCode 85
        versionName '0.9.60'
        testInstrumentationRunner 'com.elabrador.mobilenavigation.SemanticBenchmarkInstrumentation'
        buildConfigField 'String', 'ASR_TOKEN', localString('asr.token')
        buildConfigField 'String', 'TTS_API_KEY', localString('tts.apiKey')

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions 'semanticModel'
    productFlavors {
        r50 {
            dimension 'semanticModel'
            applicationIdSuffix '.r50'
            versionNameSuffix '-r50-ab'
            manifestPlaceholders = [appLabel: 'Mobile Navigation R50']
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/mask2former-R50-mapillary-semantic-320.onnx"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '186375720L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '320'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '320'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"Mask2Former R50"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION', '"R50 A/B 基线（约 178 MB）"'
            buildConfigField 'String', 'SEMANTIC_MODEL_KIND', '"MASK2FORMER_ONNX"'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_WIDTH', '320'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_HEIGHT', '320'
            buildConfigField 'int', 'SEMANTIC_FRAME_INTERVAL', '30'
        }
        swinl {
            dimension 'semanticModel'
            versionNameSuffix '-swinl-source'
            manifestPlaceholders = [appLabel: 'Mobile Navigation Swin-L']
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/mask2former-swinL-mapillary-semantic-640x480.onnx"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '910377637L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '640'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '480'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"Mask2Former Swin-L"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION', '"源码等价 Swin-L 65 类 640x480 模型（WebGPU 等价裁剪版）"'
            buildConfigField 'String', 'SEMANTIC_MODEL_KIND', '"MASK2FORMER_ONNX"'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_WIDTH', '640'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_HEIGHT', '480'
            buildConfigField 'int', 'SEMANTIC_FRAME_INTERVAL', '30'
        }
        fast {
            dimension 'semanticModel'
            applicationIdSuffix '.fast'
            testApplicationId 'com.elabrador.mobilenavigation.test'
            versionNameSuffix '-pidnet-gpu'
            manifestPlaceholders = [appLabel: 'Mobile Navigation Fast']
            externalNativeBuild {
                cmake {
                    arguments '-DELABRADOR_OPTIMIZED_NATIVE=ON'
                }
            }
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/pidnet-s-cityscapes-1024.tflite"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '30645332L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '1024'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '1024'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_WIDTH', '128'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_HEIGHT', '128'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"PIDNet-S"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION',
                    '"PIDNet-S 19 类 LiteRT GPU 候选模型（完整视野 + D455 地面约束）"'
            buildConfigField 'String', 'SEMANTIC_MODEL_KIND', '"PIDNET_LITERT"'
            buildConfigField 'int', 'SEMANTIC_FRAME_INTERVAL', '1'
        }
        turbo {
            dimension 'semanticModel'
            applicationIdSuffix '.turbo'
            versionNameSuffix '-pidnet-gpu-dual-stage'
            manifestPlaceholders = [appLabel: 'Mobile Navigation Turbo']
            externalNativeBuild {
                cmake {
                    arguments '-DELABRADOR_OPTIMIZED_NATIVE=ON'
                }
            }
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/pidnet-s-cityscapes-1024.tflite"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '30645332L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '1024'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '1024'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_WIDTH', '128'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_HEIGHT', '128'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"PIDNet-S"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION',
                    '"PIDNet-S 19 类 LiteRT GPU 流水线调度版（完整视野 + D455 地面约束）"'
            buildConfigField 'String', 'SEMANTIC_MODEL_KIND', '"PIDNET_LITERT"'
            buildConfigField 'int', 'SEMANTIC_FRAME_INTERVAL', '1'
        }
        npu {
            dimension 'semanticModel'
            applicationIdSuffix '.npu'
            versionNameSuffix '-pidnet-neuron-cloud-cache'
            manifestPlaceholders = [appLabel: 'Mobile Navigation NPU']
            externalNativeBuild {
                cmake {
                    arguments '-DELABRADOR_OPTIMIZED_NATIVE=ON'
                }
            }
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/pidnet-s-cityscapes-1024-neuron-stage2.tflite"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '31976968L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '1024'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '1024'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_WIDTH', '128'
            buildConfigField 'int', 'SEMANTIC_OUTPUT_HEIGHT', '128'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"PIDNet-S NPU"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION',
                    '"PIDNet-S 19 类 MediaTek Neuron NPU 版（完整视野 + D455 地面约束）"'
            buildConfigField 'String', 'SEMANTIC_MODEL_KIND', '"PIDNET_NEURON"'
            buildConfigField 'int', 'SEMANTIC_FRAME_INTERVAL', '1'
        }
    }

    sourceSets {
        turbo.assets.srcDirs = ['src/fast/assets']
        npu.assets.srcDirs = ['src/npu/assets']
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        noCompress 'onnx', 'tflite'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    compileOnly 'com.google.ai.edge.litert:litert:1.4.1'
    compileOnly 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    fastImplementation 'com.google.ai.edge.litert:litert:1.4.1'
    fastImplementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    turboImplementation 'com.google.ai.edge.litert:litert:1.4.1'
    turboImplementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    npuImplementation 'com.google.ai.edge.litert:litert:1.4.1'
    npuImplementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    implementation project(':librealsense')
    testImplementation 'junit:junit:4.13.2'
}

def verifyVinsAndroidDependencies = tasks.register('verifyVinsAndroidDependencies') {
    group = 'verification'
    description = 'Fails before packaging when the generated VINS Android dependencies are absent.'
    doLast {
        def dependencyRoot = rootProject.file('third_party/vins_android_deps')
        def requiredFiles = [
                new File(dependencyRoot, 'opencv/sdk/native/jni/OpenCVConfig.cmake'),
                new File(dependencyRoot, 'eigen3/Eigen/Core'),
                new File(dependencyRoot, 'boost-header-stage/boost_1_69_0/boost/shared_ptr.hpp'),
                new File(dependencyRoot, 'ceres/arm64-v8a/lib/cmake/Ceres/CeresConfig.cmake')
        ]
        def missingFiles = requiredFiles.findAll { !it.isFile() }
        if (!missingFiles.isEmpty()) {
            def relativePaths = missingFiles.collect {
                rootProject.projectDir.toPath().relativize(it.toPath()).toString()
            }.join('\n  - ')
            throw new GradleException(
                    "VINS Android dependencies are missing:\n  - ${relativePaths}\n" +
                    "Run .\\tools\\prepare_vins_android_deps.ps1 before building the APK.")
        }
    }
}

tasks.configureEach {
    if (name.startsWith('configureCMake') || name.startsWith('buildCMake')) {
        dependsOn verifyVinsAndroidDependencies
    }
}
