plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elabrador.mobilenavigation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elabrador.mobilenavigation'
        minSdk 24
        targetSdk 35
        versionCode 82
        versionName '0.9.57'
        testInstrumentationRunner 'com.elabrador.mobilenavigation.SemanticBenchmarkInstrumentation'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions 'semanticModel'
    productFlavors {
        r50 {
            dimension 'semanticModel'
            applicationIdSuffix '.r50'
            versionNameSuffix '-r50-ab'
            manifestPlaceholders = [appLabel: 'Mobile Navigation R50']
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/mask2former-R50-mapillary-semantic-320.onnx"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '186375720L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '320'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '320'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"Mask2Former R50"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION', '"R50 A/B 基线（约 178 MB）"'
        }
        swinl {
            dimension 'semanticModel'
            versionNameSuffix '-swinl-source'
            manifestPlaceholders = [appLabel: 'Mobile Navigation Swin-L']
            buildConfigField 'String', 'SEMANTIC_MODEL_ASSET',
                    '"models/mask2former-swinL-mapillary-semantic-640x480.onnx"'
            buildConfigField 'long', 'SEMANTIC_MODEL_BYTES', '910448873L'
            buildConfigField 'int', 'SEMANTIC_MODEL_WIDTH', '640'
            buildConfigField 'int', 'SEMANTIC_MODEL_HEIGHT', '480'
            buildConfigField 'String', 'SEMANTIC_MODEL_NAME', '"Mask2Former Swin-L"'
            buildConfigField 'String', 'SEMANTIC_MODEL_DESCRIPTION', '"源码等价 Swin-L 65 类 640x480 模型（可变形注意力已修复）"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        noCompress 'onnx'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    implementation project(':librealsense')
    testImplementation 'junit:junit:4.13.2'
}
