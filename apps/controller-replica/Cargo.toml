[package]
name = "controller-replica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
controller-replication = { path = "../../core/controller-replication" }
state = { path = "../../core/state" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["asm"] }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
